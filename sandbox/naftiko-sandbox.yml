local_developer_loop:
  description: 'The offline equivalent of a hosted sandbox — everything needed to exercise a capability on a laptop before any upstream is involved.'
  items:
    - {tool: 'ikanos serve', description: 'Run a capability locally and block until stopped. Same command contract in the CLI and the container.'}
    - {tool: 'ikanos validate <file>', description: 'Validate capability YAML against the bundled JSON Schema before running it.'}
    - {tool: 'docker run ghcr.io/naftiko/ikanos', description: 'Anonymously pullable image, 24 tags. Entrypoint defaults to `ikanos serve` reading /app/ikanos.yaml.'}
    - {tool: 'Control port', description: 'GET /health/live, /health/ready, /status, /metrics, /traces on a running capability — the local inspection surface. See cli/naftiko-cli.yml.'}
    - {tool: 'Reverse tunnel', description: 'A documented guide at shipyard.naftiko.io/ikanos/1.0.0-beta3/guide/reverse-tunnel/ for exposing a locally-run capability.'}
    - {tool: 'Schema examples', description: 'Capability examples shipped in the repo at modules/ikanos-spec/src/main/resources/schemas/examples/ (cir.yml, notion.yml, skill-adapter.yml, …), per the published AGENTS.md.'}
    - {tool: 'Tutorial fixtures', description: 'A 10-step Shipyard tutorial (step-1 … step-10) in modules/ikanos-docs/tutorial/, backed by the shipyard-cloudflare sandbox above.'}
authentication_note: >-
  There are no Naftiko-issued API keys, no test/live key prefixes and no magic test values
  to capture, because Naftiko issues no credentials. Auth in this product is something the
  engine SPEAKS to a customer's upstreams (Bearer, API key, basic, digest, OAuth 2.1) —
  configured by the capability author against their own systems. That is why no
  authentication/naftiko-authentication.yml was written: an auth profile here would
  describe the customer's APIs, not Naftiko's.
ownership_note: >-
  The 136 specifications under specs/ describe THIRD-PARTY APIs (Anthropic, OpenAI, Slack,
  GitHub, Google, Webflow, Apache and others). They are mock fixtures Naftiko hosts, not
  contracts Naftiko authored or serves, so none of them was harvested into openapi/ as a
  Naftiko API. Doing so would have credited Naftiko with two dozen APIs it does not ship.

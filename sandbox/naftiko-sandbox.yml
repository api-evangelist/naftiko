provider: Naftiko
providerId: naftiko
description: >-
  Naftiko's sandbox surface is unusual enough to be worth stating plainly: it is not test
  credentials for a Naftiko API, because there is no Naftiko API. It is a mock-service
  programme aimed at the OTHER end of the integration — 136 third-party OpenAPI
  specifications mounted into a Microcks instance so a developer can build and run an
  Ikanos capability against realistic Slack, GitHub, Google or Anthropic responses without
  holding a single upstream credential. Two layers ship: a centrally-hosted mock host that
  serves the responses, and roughly two dozen per-provider "sandbox" repositories that wrap
  those mocks as one-click-deployable Ikanos capabilities. Nothing below was invented; the
  URL pattern, the deploy targets and the spec count were read from the published repo.
sandbox_type: mock-service-for-consumed-apis
test_credentials_required: false
test_vs_live_separation: 'not applicable — no Naftiko-issued keys exist, in test mode or otherwise (see authentication note below)'
hosted_mocks:
  name: Naftiko Mocks
  host: https://mocks.naftiko.net
  engine: Microcks
  deployment: 'Cloudflare Worker + Container (wrangler.toml declares a MicrocksContainer Durable Object binding, one standard-1 instance)'
  url_pattern: 'https://mocks.naftiko.net/rest/<info.title>/<info.version>/'
  url_pattern_note: >-
    The mock path is built from each spec's own info.title and info.version. CONTRIBUTING.md
    requires info.title to be a strict slug (lowercase, hyphens, alphanumeric) and
    info.version to avoid slashes and spaces, because both become path segments.
  spec_count: 136
  spec_source: https://github.com/naftiko/sandboxes/tree/main/specs
  contribution: 'Open a PR adding a file under specs/. CI lints it; merge to main rolls the Cloudflare Worker forward automatically.'
  probe:
    - {url: 'https://mocks.naftiko.net/', status: 401, checked: '2026-08-17'}
    - {url: 'https://mocks.naftiko.net/api/services', status: 401, checked: '2026-08-17'}
    - {url: 'https://mocks.naftiko.net/rest', status: 401, checked: '2026-08-17'}
  probe_finding: >-
    The host is live but returns HTTP 401 with an empty body on every path probed,
    including the root. The README presents it as the central mock target for the sandbox
    capabilities, but an anonymous developer cannot reach it — so the documented
    "no upstream credentials required" promise holds only for the self-deployed layer
    below, not for the hosted mock host itself. Recorded as observed, not as a defect.

description: >-
  Naftiko's published lifecycle posture. It versions software rather than a hosted API, so
  the lifecycle surface is a release/EOL table plus a versioned documentation tree — not a
  Sunset/Deprecation header policy. What is genuinely published: semantic versions with
  codenames, a per-version end-of-life date, a stated Java baseline with its own EOL, the
  Maven groupId in force at each version, versioned docs per release, and an itemised
  public roadmap. What is not published: a status page, an SLA document, RFC 8594
  Sunset/Deprecation headers, and a security advisory feed.
versioning:
  scheme: semver-with-prerelease
  current: v1.0.0-beta4
  current_date: '2026-08-17'
  stability: 'Pre-1.0. Ikanos has been in beta since 2026-06-29; Naftiko calls beta1 "the first release stable enough for real integrations".'
  spec_versioning:
    description: >-
      The capability spec carries its own version, distinct from the engine version. The
      JSON Schema $id is https://ikanos.io/schemas/v1.0.0-beta2/ikanos.json, `ikanos
      validate <file> [<schema-version>]` accepts an explicit x.x schema version, and
      `ikanos -V` prints the schema version of the running CLI rather than the build
      version. Two repo workflows (synchronize-schema-version-in-other-repos,
      synchronize-engine-version-in-other-repos) propagate both numbers across the org.
    compatibility_claim: >-
      Naftiko states on the editions page that "the same capability YAML survives every
      upgrade unchanged" and, on the homepage, that "when the MCP transport revises, it's
      an engine bump — your YAML is unchanged."
  docs_versioning:
    style: 'per-release documentation trees at https://shipyard.naftiko.io/ikanos/<version>/'
    versions_live: ['1.0.0-alpha4', '1.0.0-beta1', '1.0.0-beta2', '1.0.0-beta3']
    note: 'No /ikanos/1.0.0-beta4/ tree was serving at harvest time (404), one day after the beta4 release — docs lag the release train.'

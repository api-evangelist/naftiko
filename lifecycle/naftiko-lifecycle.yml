  style: 'itemised, grouped by theme, undated'
  themes:
    - name: Rightsize AI context
      items:
        - 'Upgrade MCP transport in engine to the July 2026 version of the protocol (no spec impact)'
        - 'Deterministic orchestration — conditional steps, for-each steps, parallel-join'
        - 'A2A server adapter with tool discovery and execution'
        - 'Dynamic MCP tools search; `ikanos import mcp` to inspect an existing MCP server and generate an exposes: type: mcp capability'
        - 'Skills publication in skills marketplaces; MCP/AI gateway integration; MCP trust propagation; interactive MCP Apps'
        - 'AI framework wrappers (LangChain4j, LangChain, LlamaIndex); support the AI Catalog spec'
    - name: Reuse existing APIs & data
      items:
        - 'FILE and SQL client adapters; gRPC consumption including proto import'
        - 'HTTP client resiliency — retry, time limiter, circuit breaker, rate limiter, bulkhead, cache, fallback'
        - 'Webhook server adapter; token refresh on consumed APIs; mTLS client certificates; CORS configuration'
        - 'Pagination at consumes and exposes level; HTTP cache-control directives'
        - 'Client SDK generation in the Ikanos CLI (TypeScript, Python, Java, Go), extensible to third-party generators'
    - name: Core developer experience
      items:
        - 'Starter capability templates (golden-path skeletons)'
        - 'Publish Naftiko JSON Structure; publish the JSON Schema to JSON Schema Store'
        - 'Live generated capability UI (Swagger UI / Redocly style); Control web app per capability'
        - 'Reference bridge capabilities (RSS/Atom, XML/SOAP, CSV); Docker Desktop Extension'

description: >-
  A recorded absence. Every RFC 8615 well-known path was probed against every host Naftiko
  controls and not one returned a real document. Two distinct failure shapes were observed
  and they are kept apart below, because they are different facts: naftiko.io answers a
  hard 404 for every path, while shipyard.naftiko.io is a single-page application whose
  catch-all answers HTTP 200 with a 760-byte HTML shell for EVERY path — including paths
  that certainly do not exist. Those 200s are recorded as misses, not hits: the body is

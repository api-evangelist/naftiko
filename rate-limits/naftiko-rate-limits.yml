engine_capability_note: >-
  A distinction worth holding: rate limiting appears on Naftiko's ROADMAP as something the
  engine will do FOR its operator — "HTTP client resiliency — retry, time limiter, circuit
  breaker, rate limiter, bulkhead, cache, fallback" is listed under future work on consumed
  upstream APIs. That is a product feature the customer would configure against their own
  upstreams. It is not a limit Naftiko imposes on a caller, it is not shipped as of
  v1.0.0-beta4, and it was not counted as a published limit here.
future_signal: >-

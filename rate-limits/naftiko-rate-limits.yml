description: >-
  Naftiko publishes no rate limits, and the reason is structural rather than an omission.
  There is no hosted Naftiko API to limit: the Community edition is software the customer
  runs on their own infrastructure, so throughput is bounded by the customer's own machine,
  not by a Naftiko quota. The editions page — the one page where a limit would appear —
  carries a full feature-by-edition comparison table with no quota, no request ceiling, no
  seat count and no overage rate in any column. The two editions where a Naftiko-enforced
  limit would eventually apply (Developer and Team managed hosting) are both marked
  "Coming soon · In development" and are not purchasable, so no limits exist to publish yet.

x-pointers-deliberately-withheld:
  description: >-
    Recorded so a later round does not "fix" these as oversights. Each is a canonical
    pointer the rating reads, each has an artifact in this repo that superficially supports
    it, and each was withheld because the underlying thing is a product feature Naftiko
    sells rather than a commitment Naftiko makes about a surface of its own.
  withheld:
  - type: Idempotency
    why: >-
      The capability schema defines an `idempotent` boolean in two places ($defs.Semantics
      and $defs.McpToolHints), but those are declarations a capability AUTHOR makes about
      their own tools. Naftiko exposes no callable surface, publishes no idempotency-key
      header and states no replay contract, so the agent-readiness question — can an agent
      safely retry a call to this provider — has no subject. See conventions/.
  - type: SDKs
    why: >-
      packages/ holds 8 genuine first-party distributions, but they are the product itself
      (engine, CLI, linter, container image, IDE extension), not client libraries for an
      API. Naftiko's own roadmap lists "Client SDK generation in the Ikanos CLI
      (TypeScript, Python, Java, Go)" as unshipped future work. Packages is wired; SDKs is
      not.
  - type: WellKnown
    why: >-
      well-known/naftiko-well-known.yml documents zero documents across six hosts. The
      shipyard SPA returns HTTP 200 for every /.well-known/* path with an HTML shell; those
      were recorded as misses. A pointer would assert Naftiko serves a discovery surface it
      does not serve.
  - type: SecurityTxt
    why: 'No security.txt on any host, and no SECURITY.md in naftiko/ikanos or the org .github repo.'
  - type: Security
    why: >-
      probe-security-programs.py found no vulnerability-disclosure policy, no security@
      contact, no disclosure page and no bug-bounty programme. Nothing to point at.
  - type: Compliance
    why: >-
      The only place SOC 2, PCI, NIST and GDPR appear is the Enterprise column of the
      editions table, describing continuous compliance the PRODUCT would let a customer
      enforce over their own capabilities. Naftiko publishes no trust centre, certification
      or audit report of its own.
  - type: StatusPage
    why: 'status.naftiko.io does not resolve. With Community running on customer infrastructure, none would apply until managed hosting ships.'
  - type: AgentCard
    why: >-
      Probed /.well-known/agent-card.json and the legacy /.well-known/agent.json on every
      host — 404 on naftiko.io, SPA shell on shipyard.naftiko.io, 302 on ikanos.io, 401 on
      mocks.naftiko.net. A2A is a roadmap item, not a shipped adapter. Per pipeline rule,
      nothing was written to a2a/ at all.
  - type: AsyncAPI
    why: >-
      AsyncAPI has a Naftiko glossary entry claiming support, but no asyncapi path exists
      anywhere in the shipped schema, CLI or repository tree, and a webhook server adapter
      is still listed as future work. A documentation-versus-implementation gap, not an
      event surface.
  - type: Signup
    why: 'No account signup exists — nothing is purchasable. Community is a download; Developer and Team are in development; Enterprise is a demo request.'
  - type: PostmanWorkspace
    why: 'No public Postman workspace or collection found for Naftiko, Ikanos or Polychro.'

aid: naftiko
name: Naftiko
description: >-
  Naftiko builds spec-driven integration software for AI agents. Its two Apache 2.0 Java
  engines — Ikanos, a capability engine, and Polychro, a polyglot spec linter — let a team
  declare a slice of its business in a single YAML capability file and serve it
  simultaneously over MCP, Agent Skill, REST and a Control port without writing or
  compiling code. A capability consumes the HTTP APIs an organisation already has,
  structures their responses into clean JSON, then aggregates and orchestrates those
  operations into one governed contract for agents, applications and partners. Naftiko
  operates no hosted API of its own: it distributes software customers run on their own
  infrastructure, so this profile catalogs a published JSON Schema, a governance ruleset, a
  CLI, container images and Maven artifacts rather than endpoints and API keys. Four
  editions are published — Community (free forever, Apache 2.0), Developer and Team
  (managed hosting, in development) and Enterprise (Warden and Skipper, design partners) —
  none of them carrying a published price.

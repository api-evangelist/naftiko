x-apis-note: >-
  Deliberately empty, and this is a measurement rather than an unfinished harvest. Naftiko
  publishes no OpenAPI, no AsyncAPI, no GraphQL schema and no hosted API. STEP 0b contract
  discovery was run in full against naftiko.io, shipyard.naftiko.io, ikanos.io,
  polychro.io, mocks.naftiko.net, api.naftiko.io and app.naftiko.io: naftiko.io hard-404s
  every spec path, shipyard.naftiko.io is a single-page app whose catch-all answers 200
  with a 760-byte HTML shell for every path (recorded as misses, not hits), ikanos.io and
  polychro.io are 302 vanity redirects into that same SPA, api. and app. do not resolve in
  DNS, and mocks.naftiko.net answers 401 on every path. Three HTTP surfaces are documented
  but none is a Naftiko-operated endpoint with a base URL: the Control port on a running
  capability (default localhost:9090), the Skill Server (default localhost:9700), and the
  MCP server the engine generates from the customer's own capability YAML. All three run on
  the customer's infrastructure and are recorded in conventions/, skills/ and mcp/
  respectively. The 136 OpenAPI files in naftiko/sandboxes describe third-party APIs
  (Anthropic, Slack, GitHub, Google and others) used as mock fixtures; they were not
  harvested as Naftiko contracts.
